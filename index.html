<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Robinhood | Get your $200 Reward</title>
    <style>
        :root {
            --rh-green: #00c805;
            --rh-black: #000000;
            --rh-gray: #f5f5f7;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--rh-gray); 
            margin: 0; 
            padding: 0; 
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--rh-black);
        }

        /* Header area */
        .nav-bar {
            width: 100%;
            height: 60px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            width: 120px;
            height: auto;
        }

        /* Main Content */
        .hero-section {
            text-align: center;
            padding: 40px 20px;
            width: 90%;
            max-width: 400px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        .reward-amount {
            font-size: 48px;
            font-weight: 800;
            color: var(--rh-green);
            margin: 10px 0;
        }
        .description {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Button */
        .btn-claim {
            background: var(--rh-green);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-claim:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Fake iOS Notification */
        #ios-notification {
            position: fixed;
            top: -100px;
            left: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 12px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }
        #ios-notification.show {
            top: 50px; /* Adjusted for dynamic island area */
        }
        .notif-icon {
            width: 20px;
            height: 20px;
            background: var(--rh-green);
            border-radius: 4px;
            margin-right: 10px;
        }
        .notif-content {
            flex: 1;
        }
        .notif-title {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .notif-body {
            font-size: 13px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/Robinhood_logo.svg/1200px-Robinhood_logo.svg.png" class="logo" alt="Robinhood">
    </div>

    <div class="hero-section">
        <h1>Special Offer</h1>
        <div class="card">
            <p style="margin: 0; font-weight: 600; color: #666;">You've been selected for a</p>
            <div class="reward-amount">$200.00</div>
            <p class="description">
                Claim your referral bonus today. This offer is valid for the next 24 hours only.
            </p>
            <button class="btn-claim" onclick="claimReward()">Claim Reward</button>
        </div>
        <p style="font-size: 12px; color: #999; margin-top: 20px;">
            *Terms and conditions apply. Subject to account verification.
        </p>
    </div>

    <!-- Fake iOS Notification -->
    <div id="ios-notification">
        <div class="notif-icon"></div>
        <div class="notif-content">
            <div class="notif-title">Robinhood</div>
            <div class="notif-body">Verification required to release your $200.00 reward.</div>
        </div>
    </div>

    <script>
        function claimReward() {
            // Visual feedback on button
            const btn = document.querySelector('.btn-claim');
            btn.innerText = "Processing...";
            btn.style.background = "#ccc";
            btn.disabled = true;

            // Trigger the fake iOS notification after a short delay
            setTimeout(() => {
                const notif = document.getElementById('ios-notification');
                notif.classList.add('show');

                // Hide notification after 5 seconds
                setTimeout(() => {
                    notif.classList.remove('show');
                }, 5000);
            }, 800);

            // Simulate a redirect or action
            setTimeout(() => {
                alert("To complete your claim, please verify your account via the Robinhood app.");
                btn.innerText = "Claim Reward";
                btn.style.background = "#00c805";
                btn.disabled = false;
            }, 2000);
        }

        // Randomly trigger the notification on page load to make it feel "real"
        window.onload = () => {
            setTimeout(() => {
                // Only trigger if user is inactive for 3 seconds
                document.getElementById('ios-notification').classList.add('show');
                setTimeout(() => {
                    document.getElementById('ios-notification').classList.remove('show');
                }, 4000);
            }, 3000);
        };
    </script>
</body>
</html>
